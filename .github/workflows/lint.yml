name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Pinned on purpose. `uvx ruff` without a version re-resolves to the newest
      # release on every run, so a ruff formatting change turns an untouched repo red
      # overnight (that is what happened: experiments/2026-10-03-voice-design/design.py
      # was formatted by ruff 0.14 and 0.17 wanted it differently, and Lint was failing
      # on commits that touched nothing). Bump deliberately, with a reformat commit.
      - name: Run ruff format check
        run: uvx ruff@0.17.0 format --check .

      - name: Run ruff lint
        run: uvx ruff@0.17.0 check .

      - name: Run ty type checking
        # Scoped to the live code path; the legacy loop (app/, tts_server/,
        # spike/) has pre-existing diagnostics and is deleted at the Phase 2
        # cutover (issue #22), at which point restore `uvx ty check` full-repo.
        # A minimal env gives ty something to resolve imports against
        # without syncing the multi-GB torch stack.
        run: |
          uv venv .venv-typedeps
          VIRTUAL_ENV=.venv-typedeps uv pip install numpy pyyaml websockets python-dotenv sounddevice soundfile pytest
          uvx ty@0.0.86 check --python .venv-typedeps/bin/python shell tests

      - name: Run tests
        # Hardware-free suite: only numpy + pyyaml needed at import time.
        run: uvx --with numpy --with pyyaml --with pytest pytest tests/ -q --no-header
