# Pinned upstream services, models, and builds.
# Rule: nothing runs on this machine without an entry here with a revision/hash
# and measured cost. Update MEASURED alongside, never above. See ADR 0004/0006.
version: 1

services:
  speech-to-speech:
    repo: https://github.com/huggingface/speech-to-speech
    ref: v1.0.0            # re-verify protocol quirks (ADR 0001) on every bump
    install: separate venv via scripts/install_s2s.sh   # never vendored, never forked
    transport: ws://127.0.0.1:8765/v1/realtime
    measured: pending robot-machine run
  llama-cpp:
    repo: https://github.com/ggml-org/llama.cpp
    # Pascal-correct local build: -DCMAKE_CUDA_ARCHITECTURES=61 -DGGML_CUDA_F16=OFF
    # build pinned in scripts/build_llama.sh; source rev recorded at build time
    revision: TBD-record-at-build
    measured: Qwen3.5-4B low-40s tok/s (commit 9f6e673)

models:
  llm:
    id: ibm-granite/granite-4.1-3b-GGUF   # since 2026-10-10, text-only
    quant: Q6_K (2.8 GB file)
    context: 32K x 2 slots, KV q8_0/q8_0 (NEVER mixed K/V types on Pascal - see run_llama_server.sh)
    measured: 3.86 GB VRAM @ 32K beside Obama Qwen3-TTS (total 7.2 of 8 GB);
      llama-bench pp1024 1037 t/s, tg 46 t/s; toolbench 20/20 (experiments/2026-10-04-llm-bakeoff)
  llm_previous:
    id: unsloth/Qwen3.5-4B-MTP-GGUF
    quant: UD-Q4_K_XL
    mmproj: F16 only, never BF16 (ADR 0004)
    measured: 4.47 GB VRAM @ 32K with mmproj; pp1024 956 t/s at q8_0/q8_0 KV (245 at q8_0/q4_0)
  vlm:
    id: unsloth/Qwen3.5-0.8B-GGUF   # camera tools only, separate server (scripts/run_vision_server.sh)
    quant: Q4_K_M + mmproj-F16
    runtime: llama-server CPU, 4 threads, :8082
    measured: 2.5 s per 448 px describe on the i7-6700K beside the live stack; ~1 GB RAM
      (LFM2-VL-450M 1.9 s, LFM2-VL-1.6B 5.3 s - same harness)
  stt:
    id: nvidia/parakeet-tdt-0.6b-v3
    # v2 beats v3 on EN WER (6.05 vs 6.32, ADR 0006) but s2s v1.0.0 loads
    # Parakeet via nano-parakeet, which hardcodes the v3 vocab (8193) - v2 dies
    # with a decoder.embed size mismatch. Revisit when upstream supports v2.
    runtime: s2s nano-parakeet (torch), CPU fp32 (NEVER int8 / fp16 on this box)
    measured: pending
  tts_production:
    id: kokoro                 # until the Phase 4 bakeoff says otherwise
    runtime: torch cu126 GPU (kokoro-onnx CUDA EP broken on sm_61)
    measured_vram: ~904 MiB + 250 MB ctx
    measured_rtf: 0.038-0.044
  tts_trial:
    id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice (speaker Ryan)   # Phase 4 bakeoff candidate
    weights: Serveurperso/Qwen3-TTS-GGUF qwen-talker-0.6b-customvoice-Q8_0 + qwen-tokenizer-12hz-Q8_0
    runtime: s2s --tts qwen3 ggml backend + qwentts.cpp 6fae929 built for sm_61 (scripts/build_qwentts.sh)
    never: PyPI qwentts wheel (sm_75+ only), BF16 quant (no BF16 on Pascal), torch fp32 (OOM beside llama)
    measured: TTFA 0.25s streaming, RTF 0.31 offline, ~1.2 GB; total GPU 6.7 GB with llama + Parakeet(CPU)
  kws:
    id: sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
    sha256: f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a   # tar.bz2
    install: scripts/get_kws_model.sh -> models/kws (fp32 onnx, 1 thread)
    runtime: sherpa-onnx 1.13.8 + sherpa-onnx-core 1.13.8 (lockstep)
    measured: "Reachy" fires at threshold <=0.25 (synth speech); real-room tuning pending (issue #23)

runtime:
  python: ">=3.12"
  torch: "2.11.0+cu126 (matched torchaudio pair; sm_61 check on every bump)"
  reachy_mini_sdk: "1.8.x targeted only (>=1.9 breaks daemon/BLE API + CORS)"
