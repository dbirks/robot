# Pinned upstream services, models, and builds.
# Rule: nothing runs on this machine without an entry here with a revision/hash
# and measured cost. Update MEASURED alongside, never above. See ADR 0004/0006.
version: 1

services:
  speech-to-speech:
    repo: https://github.com/huggingface/speech-to-speech
    ref: v1.0.0            # re-verify protocol quirks (ADR 0001) on every bump
    install: separate venv via scripts/install_s2s.sh   # never vendored, never forked
    transport: ws://127.0.0.1:8765/v1/realtime
    measured: pending robot-machine run
  llama-cpp:
    repo: https://github.com/ggml-org/llama.cpp
    # Pascal-correct local build: -DCMAKE_CUDA_ARCHITECTURES=61 -DGGML_CUDA_F16=OFF
    # build pinned in scripts/build_llama.sh; source rev recorded at build time
    revision: TBD-record-at-build
    measured: Qwen3.5-4B low-40s tok/s (commit 9f6e673)

models:
  llm:
    id: unsloth/Qwen3.5-4B-MTP-GGUF
    quant: UD-Q4_K_XL
    mmproj: F16 only, never BF16 (ADR 0004)
    context: 24K = 2 slots x 12K, KV q8_0/q8_0 (NEVER mixed K/V types on Pascal - see run_llama_server.sh)
    measured: 4.47 GB VRAM with mmproj, total 7.84 GB beside Obama Qwen3-TTS; pp1024 956 t/s
      (245 t/s with the old q8_0/q4_0 KV); replayed real session tool calls 37-38/48
  llm_alternative:
    id: ibm-granite/granite-4.1-3b-GGUF   # tried 2026-10-10/11, reverted
    quant: Q6_K, text-only (pair with the vlm below)
    measured: 3.86 GB @ 32K; pp1024 1037 t/s; toolbench 20/20 with a short prompt, but
      24/48 (30/48 with s2s's voice wrapper stripped) on the replayed real session
  vlm:
    id: unsloth/Qwen3.5-0.8B-GGUF   # only with a text-only chat LLM (unit reachy-vision, off by default); camera tools, separate server (scripts/run_vision_server.sh)
    quant: Q4_K_M + mmproj-F16
    runtime: llama-server CPU, 4 threads, :8082
    measured: 2.5 s per 448 px describe on the i7-6700K beside the live stack; ~1 GB RAM
      (LFM2-VL-450M 1.9 s, LFM2-VL-1.6B 5.3 s - same harness)
  stt:
    id: nvidia/parakeet-tdt-0.6b-v3
    # v2 beats v3 on EN WER (6.05 vs 6.32, ADR 0006) but s2s v1.0.0 loads
    # Parakeet via nano-parakeet, which hardcodes the v3 vocab (8193) - v2 dies
    # with a decoder.embed size mismatch. Revisit when upstream supports v2.
    runtime: s2s nano-parakeet (torch), CPU fp32 (NEVER int8 / fp16 on this box)
    measured: pending
  tts_production:
    id: kokoro                 # until the Phase 4 bakeoff says otherwise
    runtime: torch cu126 GPU (kokoro-onnx CUDA EP broken on sm_61)
    measured_vram: ~904 MiB + 250 MB ctx
    measured_rtf: 0.038-0.044
  tts_trial:
    id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice (speaker Ryan)   # Phase 4 bakeoff candidate
    weights: Serveurperso/Qwen3-TTS-GGUF qwen-talker-0.6b-customvoice-Q8_0 + qwen-tokenizer-12hz-Q8_0
    runtime: s2s --tts qwen3 ggml backend + qwentts.cpp 6fae929 built for sm_61 (scripts/build_qwentts.sh)
    never: PyPI qwentts wheel (sm_75+ only), BF16 quant (no BF16 on Pascal), torch fp32 (OOM beside llama)
    measured: TTFA 0.25s streaming, RTF 0.31 offline, ~1.2 GB; total GPU 6.7 GB with llama + Parakeet(CPU)
  emotions:
    # The gesture library behind `play_emotion` (shell/motion/emotes.py). A data dependency of a
    # tool, so it gets a pin like any model: ADR 0006 does not exempt JSON. Block scalars below
    # are deliberate - a plain scalar whose continuation contains ": " is not valid YAML, and
    # this file was unparseable on exactly that until 2026-10-13 (see face_detection's runtime).
    id: pollen-robotics/reachy-mini-emotions-library   # repo_type=dataset, the vendor's own org
    revision: 873ae49f0b89114b7e535eff0c1f7560d21d9357   # resolved OFFLINE from this box 2026-10-13
    files: >-
      10 of the ~250 cached, the ones EMOTE_FILES names; 618,573 B for those ten.
    runtime: >-
      hf_hub_download with local_files_only=True, read from the DEFAULT HF_HOME only. Measured
      both ways: the shell unit sets no HF_HOME and resolves all ten, while under the s2s unit's
      HF_HOME this dataset is NOT cached - so the tool must stay in the shell process (it does)
      and scripts/fetch_emotions.py is a travel step, never a runtime step.
    measured: >-
      10/10 parse. Each gesture takes its own length from the file's time axis (surprised 2.5 s,
      hello 3.5 s, sad 9.7 s, curious 11.8 s raw) and is scaled, not truncated, to
      REACHY_EMOTE_MAX_S (default 7.0 s), because the MotionOwner plays queued animations in
      order and a 12 s feeling parks the head past a booth turn. CPU only, no VRAM, no GPU
      context, no new dependency.
    licence: >-
      NOT verified. The dataset card was not read for this pin; pollen-robotics is Polargib's own
      org so this is likely vendor demo content, but "likely" is not a licence. Check before the
      library leaves a demo, and note the .wav files shipped beside the JSON are a separate
      question from the keyframes.
  face_detection:
    id: insightface/buffalo_sc        # det_500m.onnx = SCRFD-500MF, 2.5 MB (cached in ~/.insightface)
    revision: insightface 0.7.3, onnxruntime 1.24.4, cv2 4.13.0 (all in uv.lock; no new deps)
    # Detection only: FaceAnalysis(allowed_modules=["detection"]) makes the ArcFace
    # recognizer (w600k_mbf.onnx, 13.6 MB) a no-load ("model ignore: ... recognition"),
    # so no embedding of anybody is ever computed, held or written (B1 is not this).
    runtime: onnxruntime CPUExecutionProvider, intra_op_num_threads=2 / inter_op=1 set
      per session (shell/vision/tracker.py). NEVER OMP_NUM_THREADS -- ADR 0006 plus
      app/face_tracker.py:24-31 - process-global, import-order dependent, lands on torch.
    measured: i7-6700K beside the live stack, 2 threads, no GPU. Re-run 2026-10-12
      (same harness as shell/vision/tracker.py, 64 synthetic frames @1280x720 -> det_size
      320, detection-only): p50 2.87 ms, p95 2.97 ms. Scout run (plans/face-lockon.md,
      real snapshot): detect-only 3.7 ms @320 (1.2 ms @160, and 160 px lost the desk-range
      face -> 320 is the floor); full pipeline with recognition 10.5-11.9 ms for one face,
      ~7-8 ms per extra face (6 faces 46.5 ms). Model load once: ~2.1 s (lazy, first frame).
      Non-inference parts of the poll, same box: /sys device scan p50 0.07 ms (paid on
      open only, not per sample since the 2026-10-12 rework); GET /api/media/status p50
      1.5 ms p95 5.8 ms (cached behind a 10 s TTL, so <= 0.6 ms/s of poll time; the robot
      was unplugged so the payload is untrusted, the latency is real).
    duty_cycle: the shipped poll costs ONE cv2 read + ONE inference per sample. Measured
      inference-only: 2 FPS idle = ~5.7 ms/s and 3 FPS engaged = ~8.9 ms/s of thread time,
      ~0.6-0.9% of one core (ADR 0006). UNMEASURED PENDING BENCH: the per-sample
      cap.read() cost at 1280x720 and the UVC warmup amortisation, which need the robot's
      camera attached; the 0.6-0.9% figure is inference alone and must be re-measured as
      the full sample on the bench. The 2.4%-of-a-core figure in the plan is the
      *recognition* pipeline at 2 FPS and is what re-enabling B1 would cost.
    cadence: 2 FPS on an empty room, 3 FPS while a qualified face is in frame, ZERO while
      asleep (shell/camera.py CameraStream + shell/vision/greeter.py); one owner, handle
      held open and released on stop or failure (reopen behind 2-30 s backoff), never while
      the daemon holds the device (status re-checked per 10 s). Frame grab stays 1280x720;
      only the detector sees 320 px.
  face_detection_alt:
    id: opencv_zoo/face_detection_yunet_2023mar.onnx (230 KB, cv2.FaceDetectorYN, CPU)
    measured: 3.0-3.1 ms @320 detection-only, flat vs face count
    rejected: 15-column output = no identity and no landmarks beyond the same 5 points;
      cheaper than buffalo_sc but it cannot do the per-env face gallery (B1) without a
      second resident model, which the brief refuses. Kept as the existence-only fallback
      if the booth ever needs a cheaper idle poll.
  kws:
    id: sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
    sha256: f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a   # tar.bz2
    install: scripts/get_kws_model.sh -> models/kws (fp32 onnx, 1 thread)
    runtime: sherpa-onnx 1.13.8 + sherpa-onnx-core 1.13.8 (lockstep)
    measured: "Reachy" fires at threshold <=0.25 (synth speech); real-room tuning pending (issue #23)

runtime:
  python: ">=3.12"
  torch: "2.11.0+cu126 (matched torchaudio pair; sm_61 check on every bump)"
  reachy_mini_sdk: "1.8.x targeted only (>=1.9 breaks daemon/BLE API + CORS)"
