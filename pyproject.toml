[project]
name = "reachy-local-agent"
version = "0.1.0"
description = "Local voice-driven agent for Reachy Mini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini>=1.8.0",
    # Declared explicitly (they would otherwise arrive transitively via kokoro
    # / sentence-transformers / silero-vad) so the cu126 pin in
    # [tool.uv.sources] applies to both. They must be a MATCHED PAIR -- a
    # mismatch makes torchaudio fail to load _torchaudio.abi3.so, which takes
    # Silero VAD down with it. cu126 currently tops out at 2.11.0 for
    # torchaudio, so both are held there.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "piper-tts>=1.4.0",
    "openai>=1.0.0",
    "silero-vad>=5.1",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "opencv-contrib-python>=4.10.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.24.4",
    "kokoro>=0.9.4",
    "soundfile>=0.13.1",
    "duckduckgo-search>=8.1.1",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "huggingface-hub>=1.3.0",
    "ddgs>=9.14.1",
    "onnx-asr[cpu,hub]>=0.11.0",
]

[project.optional-dependencies]
sim = ["reachy-mini[mujoco]"]
dances = ["reachy-mini-dances-library>=0.2.0"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a25",
]

# The GTX 1070 is Pascal (sm_61). cu128 and later dropped sm_61 entirely, and
# CUDA 13 dropped Pascal altogether — the default wheel ships kernels this card
# physically cannot execute (it reports cuda available, then fails to launch).
# cu126 is the last line that still contains sm_61, and we want it: Kokoro TTS
# on the GPU is ~20x faster than on this 4-core CPU and hands the cores back to
# STT and VAD. Verify torch.cuda.get_arch_list() contains sm_61 after any bump.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I"]
