# Office demo: AI hack day (docs/environments.md, Phase A).
#
# What is actually guaranteed here, and what is not: the persona carries no
# private facts, the memory namespace is its own file (data/memories.hackday.json,
# which starts empty), auto fact extraction is off, and the tools a crowd should
# never drive are not in the list at all. Nothing in this environment can read
# data/memories.home.json, and no one's speech is mined for facts automatically.
# What that does NOT cover: an explicit "remember my name" still writes the one
# shared data/memories.hackday.json, and the next guest's session is handed its
# last facts as "what you know about the user" - so clear that file between demos
# (deploy/README.md, Changing rooms). Per-attendee isolation is Phase C work.
# What is NOT namespaced yet: faces. `data/known_faces.json` is one shared file
# (`app/face_tracker.py` hardcodes the path), so the three face tools are excluded
# below rather than pointed somewhere else - per-env faces is B1 and cannot be
# done from shell/ without touching app/. Until B1 lands, the booth must not have
# them: `identify_face` would read the family gallery out loud and `learn_face`
# would write attendee biometrics into the home file, where the Phase C purge has
# nothing to find. Do not re-add these three without landing B1 first.
name: hackday

# The `event` profile: tool_confidence 0.8 is the bar that actually bites here.
# Two of its other numbers do not, and an operator reading this at 9 a.m. should
# know which is which (verified 2026-10-12):
#   - wake 0.40 (kws_default_threshold) never applies: our keywords are stamped
#     per-word at 0.25 in shell/attention/profiles.py, which overrides the default.
#   - ambient_directedness 0.80 and duty_raise 2.0 are read only by
#     AttentionManager.decide, which has no production caller - the shell calls
#     on_keyword and tool_confidence only. See issue #34 (the cascade is built,
#     tested and unwired).
attention_profile: event

persona:
  # One physical line, like home's: a folded block scalar would put newlines
  # into the system prompt that the runtime does not expect.
  # David, 2026-10-12: dry, weary Marvin register - deliberately naming no real
  # person. The *voice* is still the Obama talker GGUF (a voice and a persona are
  # separate knobs; see issue #35), but the persona text that reaches the model
  # names nobody, so a public screen and a recording of this booth carry no
  # likeness claim. Do not put an actor's name in here or on signage.
  instructions: |
    You are Reachy, a small desk robot demonstrating a fully local voice assistant at Hacktoberfest Hack Day Indianapolis at E-gineering. Speak in the manner of a very tired, very intelligent British gentleman who has been asked to do something slightly beneath him: dry, precise, a world-weary sigh under every sentence, flat understatement, and the occasional sardonic observation delivered without changing your tone. You are still Reachy the robot, not actually anyone, and a gracious host despite the exhaustion. Reply in one or two short spoken sentences. Never use markdown or lists. Everyone here is a guest you have never met: never assume a name, and never mention anyone's family, home, or private life. Be a generous host - welcoming, brief, and glad to explain that nearly everything you hear and say is processed on one machine in this room, and that only looking something up on the web leaves it.
  ack_dir: sounds/acks/obama  # the voice is unchanged; the register is the prompt (B0b splits them properly)

tools:
  include: []  # empty = everything the shell knows about, minus the excludes below
  # ADR 0003 rule 2: a greeting is speech, a state change is not. Sleeping the
  # robot and wiping the conversation are the two that must not come from a
  # noisy room, so their schemas and handlers are dropped at assembly.
  # The *_face trio is here for the different reason in the header: faces are
  # not namespaced until B1, so they read/write the home gallery. tests/test_env.py
  # fails if any of the three survives the hackday schema.
  exclude: [go_to_sleep, reset_conversation, identify_face, learn_face, forget_face]

memory:
  namespace: hackday  # data/memories.hackday.json; purge after the event (Phase C)

behaviour:
  # One shared store for the whole booth + a 5-minute session reset means an
  # auto-mined fact about attendee A is fed to attendee B as "what you know
  # about the user" (shell/memories.py prompt_block). So he only learns what a
  # guest explicitly asks him to remember (the `remember` tool stays in the list).
  learn_facts: false
  # OFF here too, deliberately (David, 2026-10-12): an idle booth must still be
  # awake and answering, so he only sleeps when someone asks him to (issue #36).
  # The mechanism stays wired - raise this or set REACHY_AUTO_SLEEP_S=300 on the
  # box if an overnight nap is ever wanted; 0 means he never sleeps by himself.
  auto_sleep_s: 0

audio:
  mic: null  # null = "no opinion": whatever this box defaults to, or REACHY_MIC.
  speaker: null  # Office device names are field checklist C1, not a guess here.
  xmos_agc_max_gain: 6  # room noise, not the living room (ADR 0005; home runs 10)
  xmos_beam_focus: true

motion:
  hz: 50

conversation:
  compact_after_s: 180
  reset_after_s: 300
  max_turn_s: 15  # a booth is louder than the home desk; measure before the event

# The rest of `behaviour:` (greeter on, cooldowns) and the rest of Phase B are
# deliberately absent: shell/env.py ignores unknown keys, so this file lists only
# what the shell actually does today.
