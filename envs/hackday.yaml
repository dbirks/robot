# Office demo: AI hack day (docs/environments.md, Phase A).
#
# What is actually guaranteed here, and what is not: the persona carries no
# private facts, the memory namespace is its own file (data/memories.hackday.json,
# which starts empty), auto fact extraction is off, and the tools a crowd should
# never drive are not in the list at all. Nothing in this environment can read
# data/memories.home.json, and no one's speech is mined for facts automatically.
# What that does NOT cover: an explicit "remember my name" still writes the one
# shared data/memories.hackday.json, and the next guest's session is handed its
# last facts as "what you know about the user" - so clear that file between demos
# (deploy/README.md, Changing rooms). Per-attendee isolation is Phase C work.
# What is NOT namespaced yet: faces. `data/known_faces.json` is one shared file
# (`app/face_tracker.py` hardcodes the path), so the three face tools are excluded
# below rather than pointed somewhere else - per-env faces is B1 and cannot be
# done from shell/ without touching app/. Until B1 lands, the booth must not have
# them: `identify_face` would read the family gallery out loud and `learn_face`
# would write attendee biometrics into the home file, where the Phase C purge has
# nothing to find. Do not re-add these three without landing B1 first.
name: hackday

# The `event` profile: tool_confidence 0.8 is the bar that actually bites here.
# Two of its other numbers do not, and an operator reading this at 9 a.m. should
# know which is which (verified 2026-10-12):
#   - wake 0.40 (kws_default_threshold) never applies: our keywords are stamped
#     per-word at 0.25 in shell/attention/profiles.py, which overrides the default.
#   - ambient_directedness 0.80 and duty_raise 2.0 are read only by
#     AttentionManager.decide, which has no production caller - the shell calls
#     on_keyword and tool_confidence only. See issue #34 (the cascade is built,
#     tested and unwired).
attention_profile: event

persona:
  # OWNER DECISION, NAMED AND DATED: David Birks, 2026-10-13, at the Hack Day booth -
  # "make it really Obama... remove that line that says deliberately naming no real
  # person. We're doing that on purpose... you update all three gates with my name."
  # So this room borrows a real public figure's persona deliberately, in the open, on a
  # recorded public screen. The inline `instructions:` block that used to outrank the
  # persona file (shell/env.py `merge_persona_doc`) is DELETED, and `name: obama` makes
  # personas/obama.yaml supply the WORDS - the documented mechanism, the one envs/home.yaml
  # spells out for the home room. The three gates that encoded the opposite rule now carry
  # his name and the date: scripts/check_env_safety.sh, tests/test_booth_rehearsal.py,
  # tests/test_persona.py.
  #
  # Both halves come from one file tonight, which is the pairing
  # tests/test_persona_voice_pairing.py guards: personas/obama.yaml `instructions:` (the
  # words), its `ack_dir:` (the ack pool) and its `voice:` block (the measured Obama 1.7B
  # talker GGUF, speaker "laxmikant", `instruct: ""` = unstyled). The timbre did not move:
  # `voice:` is byte-identical in personas/obama.yaml and personas/marvin.yaml, so picking
  # obama changes the words and the register only. personas/marvin.yaml - the tired British
  # gentleman, never a likeness of anybody - stays shipped and selectable. B0b still owns
  # splitting text from timbre properly.
  #
  # WHAT THE DECISION DID NOT BUY BACK: the rules that protect an ATTENDEE rather than the
  # famous person, none of which depend on whose name he borrows. He must never learn or
  # echo a guest's family, home, health, politics or employer:
  #   - behaviour.learn_facts is false below, and shell/env.py `reconcile_learn_facts_prompt`
  #     strips the shared prompt's unprompted-remember sentence along with it, so nothing he
  #     is told invites writing down a stranger's private fact.
  #   - memory.namespace is his own store (data/memories.hackday.json), and a non-home room
  #     landing on `home` is a hard startup error (docs/environments.md hard rule 1).
  #   - the `*_face` trio stays excluded (header): no attendee biometrics are written anywhere.
  #   - an explicit "remember my name" is still honoured, into the ONE shared booth store, so
  #     clear data/memories.hackday.json between demos (deploy/README.md, Changing rooms).
  #   - personas/obama.yaml still says it in the first person: "You are still Reachy the
  #     robot, not actually Obama." An impression, said as the machine it is.
  #
  # Voice plumbing, unchanged: until the INSTALLED reachy-s2s/reachy-shell units load
  # deploy/generated/persona.env (deploy/README.md:8 re-copies them), the picker moves this
  # room's acks only - the talker comes from .env's S2S_QWEN3_* lines. scripts/apply_env.py
  # warns out loud when that routing is missing.
  #
  # NOT FIXED FROM THIS FILE, it needs its own named decision: scripts/rehearse_booth.py
  # still lists obama and barack in REAL_PEOPLE, so its reply-side `names:*` rules and its
  # `persona names nobody` config verdict read red against a room that now speaks as Obama
  # on purpose. Narrowing that ban list to the names that must never be said at all (the
  # family names) is a change to the rehearsal's own contract.
  name: obama
  ack_dir: sounds/acks/obama  # the pool personas/obama.yaml names, said inline like home's

tools:
  include: []  # empty = everything the shell knows about, minus the excludes below
  # ADR 0003 rule 2: a greeting is speech, a state change is not. Sleeping the
  # robot and wiping the conversation are the two that must not come from a
  # noisy room, so their schemas and handlers are dropped at assembly.
  # The *_face trio is here for the different reason in the header: faces are
  # not namespaced until B1, so they read/write the home gallery. tests/test_env.py
  # fails if any of the three survives the hackday schema.
  exclude: [go_to_sleep, reset_conversation, identify_face, learn_face, forget_face]

memory:
  namespace: hackday  # data/memories.hackday.json; purge after the event (Phase C)

behaviour:
  # One shared store for the whole booth + a 5-minute session reset means an
  # auto-mined fact about attendee A is fed to attendee B as "what you know
  # about the user" (shell/memories.py prompt_block). So he only learns what a
  # guest explicitly asks him to remember (the `remember` tool stays in the list).
  learn_facts: false
  # OFF here too, deliberately (David, 2026-10-12): an idle booth must still be
  # awake and answering, so he only sleeps when someone asks him to (issue #36).
  # The mechanism stays wired - raise this or set REACHY_AUTO_SLEEP_S=300 on the
  # box if an overnight nap is ever wanted; 0 means he never sleeps by himself.
  auto_sleep_s: 0
  # B3: he says hello to whoever looks at him for ~2 s, no wake word. Detection
  # only: no face embeddings, no gallery, nothing that identifies a person is
  # written by the greeter, and a track dies when they leave the frame (shell/vision/).
  # What IS written is the decision trail - bearing, dwell, share of frame, verdict -
  # as `face.present` / `greeter.fired` journal rows under the shared 30-day
  # retention (docs/adr/0007), so "he remembered me" is not true but "the log says a
  # face was there" is. A face never grants the attention lease (ADR 0003): it buys a
  # hello, not a window into the room's speech.
  # Suppressed while he is speaking, while a conversation owns him, and while the
  # LLM owes a reply; the one in-conversation exception is the group notice below.
  greeter: true
  # Lock-on, not one-shot centring: the head aims at a face from the first sample that
  # sees it and keeps re-aiming at poll rate, so the dwell below can actually close
  # (`shell/vision/greeter.py` `_aim_target`/`_center`; it yields the head to a
  # `wake`/`doa` turn and to a tool look, and pitch is never aimed).
  greeter_face_centering: true
  greeter_scan: true             # idle sweep +-35 deg, 10 deg detents, empty room only (issue #37)
  greeter_dwell_s: 2.0        # David's call: about two seconds of looking
  greeter_cooldown_s: 120     # global minimum spacing: never nag the room
  greeter_group_cooldown_s: 300  # "hey, a few more people here" is rarer still
  greeter_max_per_hour: 6     # hard ceiling on top of both spacing windows

audio:
  mic: null  # null = "no opinion": whatever this box defaults to, or REACHY_MIC.
  speaker: null  # Office device names are field checklist C1, not a guess here.
  xmos_agc_max_gain: 6  # room noise, not the living room (ADR 0005; home runs 10)
  xmos_beam_focus: true

motion:
  hz: 50

conversation:
  compact_after_s: 180
  reset_after_s: 300
  max_turn_s: 15  # a booth is louder than the home desk; measure before the event

# 2026-10-13, booth: head-centring on a greeted face is LIVE here
# (`behaviour.greeter_face_centering: true` above, read as
# `cfg.greeter_face_centering` -> `GreeterLimits.face_centering`), so it ships on in
# hackday and off in home - docs/knobs.md is the table, tests/test_env.py pins both
# rooms. The remaining open Phase B work is everything that was never wired, not this.
