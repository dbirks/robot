<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reachy Mini — {% block title %}Dashboard{% endblock %}</title>
    <!-- Everything below is served from /static (dashboard/static/vendor). Four CDNs
         stood here until issue #38: this box has filtered egress and the booth has no
         guarantee of any, so a CDN miss rendered the page unstyled mid-demo. -->
    <script src="/static/vendor/tailwind.js"></script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/htmx-ext-sse.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#f5f0eb',
                        mint: '#d5e8d4',
                        'mint-light': '#e8f5e6',
                        blush: '#f4d4d4',
                        'blush-light': '#fce8e8',
                        lavender: '#d4d4f4',
                        'lavender-light': '#e8e8fc',
                        butter: '#f4f0d4',
                        'butter-light': '#faf8e8',
                    },
                    fontFamily: {
                        mono: ['"Maple Mono"', '"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                },
            },
        }
    </script>
    <!-- Both mono faces, vendored (see static/vendor/fonts.css) -->
    <link rel="stylesheet" href="/static/vendor/fonts.css">
    <style>
        body { background-color: #f5f0eb; font-family: 'Maple Mono', 'IBM Plex Mono', monospace; }

        /* Scrollbar */
        .scroll-area::-webkit-scrollbar { width: 8px; }
        .scroll-area::-webkit-scrollbar-track { background: #f5f0eb; border-left: 2px solid #000; }
        .scroll-area::-webkit-scrollbar-thumb { background: #000; }

        /* HTMX loading indicator */
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-indicator { display: none; }

        /* Range slider brutalist style */
        input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; background: #000; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; background: #d4d4f4; border: 3px solid #000; cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: #d4d4f4; border: 3px solid #000; cursor: pointer;
        }

        /* Select brutalist style */
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body class="min-h-screen font-mono text-black">

    <!-- NAV BAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-butter border-b-3 border-black"
         style="border-bottom: 3px solid #000;">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-4">
                <span class="text-lg font-extrabold tracking-widest uppercase">REACHY MINI</span>
            </div>
            <!-- Nav links (desktop: inline, mobile: dropdown) -->
            <div id="nav-links" class="hidden md:flex items-center gap-0 absolute md:relative top-full left-0 right-0 md:top-auto bg-butter md:bg-transparent border-b-3 md:border-0 border-black"
                 style="border-bottom: 3px solid #000;">
                <a href="/conversation"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black md:border-2
                          {% if active_page == 'conversation' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-blush{% endif %}">
                    Conversation
                </a>
                <a href="/traces"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black md:border-2 border-t-0 md:border-t-2 md:border-l-0
                          {% if active_page == 'traces' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-lavender{% endif %}">
                    Traces
                </a>
                <a href="/services"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black border-t-0 md:border-t-2 md:border-l-0
                          {% if active_page == 'services' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-mint{% endif %}">
                    Services
                </a>
                <a href="/settings"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black border-t-0 md:border-t-2 md:border-l-0
                          {% if active_page == 'settings' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-lavender{% endif %}">
                    Settings
                </a>
                <a href="/persona"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black border-t-0 md:border-t-2 md:border-l-0
                          {% if active_page == 'persona' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-lavender{% endif %}">
                    Persona
                </a>
                <a href="/environment"
                   class="block md:inline px-4 py-2 text-sm font-bold uppercase tracking-wide border-2 border-black border-t-0 md:border-t-2 md:border-l-0
                          {% if active_page == 'environment' %}bg-black text-cream{% else %}bg-cream text-black hover:bg-mint{% endif %}">
                    Environment
                </a>
            </div>
            <!-- Mic + Agent controls + Hamburger -->
            <div class="flex items-center gap-2">
                {% if readonly %}
                <!-- The gate is in the handlers; this chip is the honest label for it. -->
                <span class="text-xs font-bold uppercase bg-black text-butter px-2 py-1 border-2 border-black">read-only</span>
                {% endif %}
                <div id="mic-btn"
                     hx-get="/partials/mic_button" hx-trigger="load, every 2s" hx-swap="innerHTML">
                </div>
                <!-- No sleep/wake button: the only unit it could reach is the retired
                     reachy-agent, and starting it boots a second audio owner that silences
                     the real shell (ADR 0002). The shell sleeps on its own (auto_sleep_s). -->
                <!-- Hamburger button (mobile only, far right) -->
                <button onclick="document.getElementById('nav-links').classList.toggle('hidden')"
                        class="md:hidden flex items-center justify-center bg-cream"
                        style="border: 3px solid #000; width: 44px; height: 44px;"
                        aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
                        <line x1="3" y1="5" x2="21" y2="5"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="19" x2="21" y2="19"/>
                    </svg>
                </button>
                <div class="text-xs font-bold hidden md:block ml-2" id="clock"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto px-4 pt-20 pb-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Refusal banner: a refused mutation must be seen, not just returned. -->
    <div id="refusal-banner" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-blush border-t-3" style="border-top: 3px solid #000;"></div>

    <script>
        // A 4xx from an hx-post/delete is a read-only refusal (or a bad name), and
        // htmx drops the body by default. Show it.
        document.body.addEventListener('htmx:responseError', function (event) {
            const banner = document.getElementById('refusal-banner');
            if (!banner) return;
            banner.innerHTML = (event.detail && event.detail.xhr && event.detail.xhr.responseText) || 'Request refused';
            banner.classList.remove('hidden');
            clearTimeout(banner._hide);
            banner._hide = setTimeout(function () { banner.classList.add('hidden'); }, 8000);
        });
    </script>

    <script>
        // Live clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
