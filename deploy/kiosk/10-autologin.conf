# Autologin on tty1 for the kiosk (issue #37). FALLBACK PATH ONLY as of 2026-10-13:
# deploy/kiosk/reachy-kiosk.service is a SYSTEM unit that owns tty1, and installing it
# masks getty@tty1 - with that mask in place this file can never fire, and
# scripts/install_kiosk.sh no longer installs it. Keep it around for the case where the
# system unit is disabled and getty@tty1 unmasked, i.e. someone wants a console login on
# VT1 and startx from ~/.bash_profile instead of a unit. Installed by hand into
# /etc/systemd/system/getty@tty1.service.d/.
#
# This is what makes X legitimate on the console: the login gives david a
# logind seat on VT1, so /dev/dri and the input devices are his without setuid,
# polkit hacks or a display manager eating RAM. It also means anyone at the
# keyboard is already "david" — accepted for a demo we are standing next to
# (David, 2026-10-12: "it doesn't need to be super locked down").
#
# Unit name is `getty@tty1`, and that is still right on this box: Arch has NOT
# moved to a template called agetty@.service here (`systemctl status
# agetty@tty1.service` -> "Unit agetty@tty1.service could not be found";
# getty@.service loaded from /usr/lib/systemd/system with Alias=autovt@.service).
#
# WHY THE `-f` IN THE -o STRING IS LOAD-BEARING (measured 2026-10-13, this is the
# reason the monitor showed a login prompt through two reboots):
# agetty(8) says its autologin flag "causes an -f username option and argument
# to be added to the /bin/login command line. See --login-options, which can be
# used to modify this option's behavior." Giving `-o` REPLACES that automatic
# `-f <user>`, so the line copied from Arch's legacy fragment
#     -o '-p -- \\u'   +   autologin david
# execs `/bin/login -p --` — no username, no skip-auth, an ordinary interactive
# prompt. It then dies on agetty's own 60 s login timeout, which is the
# `restart counter is at 41 ... at 42` loop in `journalctl -u getty@tty1`.
# Keep `-f` and `\u` together in the quoted string.
#
# Uninstall: remove this file and `systemctl daemon-reload`.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty -o '-p -f -- \\u' --noclear --autologin david %I ${TERM}
